name: CI

on:
  pull_request:
  push:
    branches: [main, backend, frontend, devops]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dentalflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dentalflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: |
          python -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot(); print(f\"### Backend coverage: {float(r.get('line-rate'))*100:.1f}%\")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Seed and log in
        run: |
          docker compose exec -T backend python seed.py
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -d "username=admin@example.com&password=dentalflow-dev" | grep -q access_token
          # protected route without a token must be refused
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/patients)" = "401"
      - name: Playwright end-to-end tests (login, booking)
        run: |
          # compose network is "<folder>_default"; Playwright runs in its own image on that network
          docker run --rm --network "$(basename "$PWD" | tr 'A-Z' 'a-z')_default" -e CI=1 \
            -e E2E_BASE_URL=http://frontend:3000 -v "$PWD/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.49.1-noble sh -c "npm ci --no-audit --no-fund && npx playwright test"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skips until the Next.js app exists (frontend branch). hashFiles() isn't allowed in a job-level if.
      - id: app
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.app.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck
          npm run build
